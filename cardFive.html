<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розовая футболка — Gangshin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="NameShop"><a href="index.html">Gangshin</a></div>

  <main class="product-page">
    <a class="back" href="index.html">← Назад в каталог</a>

    <div class="product">
      <div class="product-photo">
        <img src="images/TshirtFive.jpg" alt="Чёрная футболка с фиолетовым принтом">
      </div>

      <div class="product-info">
        <h1 class="product-title">Чёрная футболка с фиолетовым принтом</h1>
        <p class="product-price">1 990 ₽ <span class="old-price">2 490 ₽</span></p>

        <p class="option-title">Размер</p>
        <div class="sizes">
          <label><input type="radio" name="size" value="S" checked> S</label>
          <label><input type="radio" name="size" value="M"> M</label>
          <label><input type="radio" name="size" value="L"> L</label>
          <label><input type="radio" name="size" value="XL"> XL</label>
          <label><input type="radio" name="size" value="2XL"> 2XL</label>
        </div>

        <button class="buy-btn">Добавить в корзину</button>

        <div class="product-desc">
          <p>Свободная футболка из плотного хлопка.</p>
          <ul>
            <li>Материал: хлопок 100%</li>
            <li>Крой: oversize</li>
            <li>Размеры: S, M, L, XL, 2XL</li>
          </ul>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
