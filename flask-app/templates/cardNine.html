<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чёрная худи — Gangshin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="NameShop"><a href="{{ url_for('main.index') }}">Gangshin</a></div>

  <main class="product-page">
    <a class="back" href="{{ url_for('main.index') }}">← Назад в каталог</a>

    <div class="product">
      <div class="product-photo">

        <img src="{{ url_for('static', filename='images/HoodieOne.jpg') }}" alt="Чёрная худи">
      </div>

      <div class="product-info">
        <h1 class="product-title">Чёрная худи</h1>

        <p class="product-price">3 000 ₽ <span class="old-price">3 490 ₽</span></p>

        <form method="post" action="{{ url_for('main.cart_add', product_id=9) }}" id="cart-form" data-product-id="9">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <p class="option-title">Размер</p>
          <div class="sizes">
            <label><input type="radio" name="size" value="S" checked> S</label>
            <label><input type="radio" name="size" value="M"> M</label>
            <label><input type="radio" name="size" value="L"> L</label>
            <label><input type="radio" name="size" value="XL"> XL</label>
            <label><input type="radio" name="size" value="2XL"> 2XL</label>
          </div>

          <div class="buy-box" id="buy-box">
            <noscript>
              <button class="buy-btn" type="submit">Добавить в корзину</button>
            </noscript>
          </div>
          <div class="product-desc">
            <p>Худи из плотного хлопка.</p>
            <ul>
              <li>Материал: хлопок 100%</li>
              <li>Крой: oversize</li>
              <li>Размеры: S, M, L, XL, 2XL</li>
            </ul>
          </div>
      </div>
    </div>
  </main>
  <script>
    const cartQty = {{ cart_qty | tojson }};

    (function () {
      const form = document.getElementById('cart-form');
      const productId = form.dataset.productId;
      const buyBox = document.getElementById('buy-box');
      const csrfToken = form.querySelector('input[name="csrf_token"]').value;

      function currentSize() {
        const checked = form.querySelector('input[name="size"]:checked');
        return checked ? checked.value : null;
      }

      function post(url, params) {
        const data = new FormData();
        Object.entries(params).forEach(([key, value]) => data.append(key, value));
        data.append('csrf_token', csrfToken);
        return fetch(url, {
          method: 'POST',
          body: data,
          headers: { 'X-Requested-With': 'XMLHttpRequest' }
        }).then(r => r.json());
      }

      function render(size) {
        const qty = cartQty[size] || 0;
        buyBox.innerHTML = '';

        if (qty > 0) {
          const box = document.createElement('div');
          box.className = 'qty-box';

          const minus = document.createElement('button');
          minus.type = 'button';
          minus.className = 'qty-btn';
          minus.textContent = '−';
          minus.addEventListener('click', () => {
            post(`/cart/update/${productId}/${size}`, { action: 'dec' })
              .then(res => { cartQty[size] = res.qty || 0; render(currentSize()); });
          });

          const label = document.createElement('span');
          label.className = 'qty-label';
          label.textContent = `В корзине: ${qty}`;

          const plus = document.createElement('button');
          plus.type = 'button';
          plus.className = 'qty-btn';
          plus.textContent = '+';
          plus.addEventListener('click', () => {
            post(`/cart/update/${productId}/${size}`, { action: 'inc' })
              .then(res => { cartQty[size] = res.qty || 0; render(currentSize()); });
          });

          box.append(minus, label, plus);
          buyBox.appendChild(box);
        } else {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'buy-btn';
          btn.textContent = 'Добавить в корзину';
          btn.addEventListener('click', () => {
            post(form.action, { size })
              .then(res => { cartQty[size] = res.qty || 0; render(currentSize()); });
          });
          buyBox.appendChild(btn);
        }
      }

      form.querySelectorAll('input[name="size"]').forEach(radio => {
        radio.addEventListener('change', () => render(currentSize()));
      });

      render(currentSize());
    })();
  </script>
</body>

</html>
